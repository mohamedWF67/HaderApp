<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify a certificate</title>
  <link rel="stylesheet" href="certificate.css">
  <script src="verify.js" defer></script>
</head>
<body>
  <main>
    <h1>Verify a certificate</h1>
    <p>Enter the code printed on the certificate. No login needed.</p>
    <form id="verify-form">
      <input id="code" placeholder="Verification code" maxlength="20" required>
      <button>Verify</button>
    </form>
    <p id="result"></p>
  </main>
</body>
</html>

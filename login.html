<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hader - Log in</title>
  <link rel="stylesheet" href="shared/style.css">
</head>
<body>
  <div class="auth-page">
    <section class="auth-intro">
      <div>
        <h1 class="wordmark">Hader</h1>
        <p class="wordmark-ar" lang="ar">حاضر</p>
        <p>Book a seat at a workshop, get checked in at each session, and download your certificate when you finish.</p>
      </div>
      <div class="demo-seats" aria-hidden="true">
        <span class="seat taken"></span><span class="seat taken"></span><span class="seat taken"></span>
        <span class="seat taken"></span><span class="seat taken"></span><span class="seat"></span>
        <span class="seat taken"></span><span class="seat taken"></span><span class="seat"></span>
        <span class="seat"></span><span class="seat taken"></span><span class="seat"></span>
      </div>
    </section>

    <main class="auth-form">
      <p id="message" class="message" hidden></p>

      <form id="login-form">
        <h2>Log in</h2>
        <label for="login-email">Email</label>
        <input id="login-email" type="email" required autocomplete="email">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" required autocomplete="current-password">
        <div class="form-actions"><button type="submit">Log in</button></div>
        <p class="switch">New here? <button id="tab-signup" type="button" class="link">Create an account</button></p>
      </form>

      <form id="signup-form" hidden>
        <h2>Create an account</h2>
        <label for="signup-name">Full name</label>
        <input id="signup-name" type="text" required maxlength="100" autocomplete="name">
        <label for="signup-email">Email</label>
        <input id="signup-email" type="email" required autocomplete="email">
        <label for="signup-password">Password</label>
        <input id="signup-password" type="password" required minlength="8" autocomplete="new-password">
        <small>At least 8 characters, with upper and lower case letters, a number and a symbol.</small>
        <div class="form-actions"><button type="submit">Create account</button></div>
        <p class="switch">Already have an account? <button id="tab-login" type="button" class="link">Log in</button></p>
      </form>
    </main>
  </div>

  <script src="shared/config.js"></script>
  <script src="shared/auth.js"></script>
  <script src="shared/api.js"></script>
  <script src="shared/login.js"></script>
</body>
</html>
